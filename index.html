<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
:root{--navy:#061D39;--blue:#3c6da4;--pale:#E4EBF3;--teal:#47d3b0;--grey:#757575;--light:#F4F6FB;--white:#fff;--red:#e05252;--orange:#e08c3a;--green:#2ecc71;--purple:#8b5cf6;--font:'DM Sans',system-ui,sans-serif;--topbar-bg:#061D39;--sidebar-bg:#fff;--detail-bg:#F4F6FB;--card-bg:#fff;--card-border:#E4EBF3;--text-main:#061D39;--text-sub:#757575;--input-bg:#F4F6FB;--sb-foot-bg:#fafbfd;--li-hover:#f8f9fc;--li-active:#F4F6FB;--logo-circle:#061D39;--logo-circle-opacity:1;}
[data-theme="dark"]{--navy:#e8ecf2;--pale:#2a3548;--light:#0d1a2b;--white:#111d2e;--grey:#8899aa;--topbar-bg:#0a1322;--sidebar-bg:#111d2e;--detail-bg:#0d1a2b;--card-bg:#162236;--card-border:#253448;--text-main:#e8ecf2;--text-sub:#8899aa;--input-bg:#162236;--sb-foot-bg:#0f1926;--li-hover:#1a2d42;--li-active:#1a2d42;--logo-circle:#6B7A8D;--logo-circle-opacity:.7;}
body{font-family:var(--font);background:var(--detail-bg);display:flex;flex-direction:column;font-size:16.5px;color:var(--text-main)}
#topbar{background:var(--topbar-bg);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:54px;flex-shrink:0;border-bottom:1px solid rgba(71,211,176,.15);}
.tb-brand{display:flex;align-items:center;gap:11px}
.tb-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-logo svg{width:36px;height:36px}
.tb-title{color:#fff;font-weight:800;font-size:18.5px;line-height:1.1}
.tb-sub{color:var(--teal);font-size:13px;opacity:.8;font-weight:500}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:8px}
.theme-toggle:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.theme-toggle svg{width:18px;height:18px;color:rgba(255,255,255,.6);transition:color .2s}
.theme-toggle:hover svg{color:#fff}
.tb-kpis{display:flex;align-items:center;gap:6px}
.kpi{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 14px}
.kpi-val{font-weight:800;font-size:23px;line-height:1}
.kpi-lbl{font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi-div{width:1px;height:30px;background:rgba(255,255,255,.12);margin:0 4px}
#body{flex:1;overflow:hidden;min-height:0;position:relative}
#sidebar{width:340px;flex-shrink:0;background:var(--sidebar-bg);border-right:none;display:flex;flex-direction:column;overflow:hidden;position:relative}
#resize-handle{width:5px;position:absolute;top:0;right:0;bottom:0;cursor:col-resize;background:var(--card-border);transition:background .15s;z-index:10}
#resize-handle:hover,#resize-handle.dragging{background:var(--teal)}
#sb-top{padding:12px 14px;border-bottom:1px solid var(--pale);flex-shrink:0}
.sw{position:relative;margin-bottom:8px}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.3;pointer-events:none}
#sb-search{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1.5px solid var(--card-border);font-size:15px;outline:none;color:var(--text-main);background:var(--input-bg);font-family:var(--font);transition:border .15s}
#sb-search:focus{border-color:var(--teal)}
.ftabs{display:flex;border-bottom:2px solid var(--card-border);margin-bottom:8px}
.ftab{flex:1;text-align:center;padding:7px 4px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;white-space:nowrap}
.ftab:hover{color:var(--text-main)}
.ftab.on{color:var(--teal);border-bottom-color:var(--teal)}
.fpanel{display:none}
.fpanel.on{display:block}
.sb-filters{display:flex;gap:4px;flex-wrap:wrap}
.fb{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.03em;cursor:pointer;border:none;background:var(--input-bg);color:var(--text-sub);font-family:var(--font);transition:all .15s}
.fb.on{background:var(--teal);color:#061D39}
.sel-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sel-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--card-border);background:var(--card-bg);color:var(--text-sub);font-family:var(--font);transition:all .12s}
.sel-btn:hover{border-color:var(--teal);color:var(--text-main)}
.sel-range{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-sub)}
.sel-range input{width:70px;padding:3px 6px;border:1.5px solid var(--card-border);border-radius:5px;font-size:11px;font-family:var(--font);outline:none;color:var(--text-main);background:var(--input-bg)}
.sel-range input:focus{border-color:var(--teal)}
.li-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--card-border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;font-size:10px;color:#fff}
.li-check.checked{background:var(--teal);border-color:var(--teal)}
.multi-bar{background:var(--topbar-bg);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(71,211,176,.15)}
.multi-bar .mb-count{color:var(--teal);font-weight:800;font-size:14px}
.multi-bar .mb-label{color:rgba(255,255,255,.5);font-size:12px}
.multi-bar .mb-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;font-family:var(--font)}
.multi-bar .mb-btn.orange{background:transparent;color:var(--orange);border-color:var(--orange)}
.multi-bar .mb-btn.orange:hover{background:var(--orange);color:#fff}
.multi-bar .mb-btn.purple{background:transparent;color:var(--purple);border-color:var(--purple)}
.multi-bar .mb-btn.purple:hover{background:var(--purple);color:#fff}
.multi-bar .mb-btn.red{background:transparent;color:var(--red);border-color:var(--red)}
.multi-bar .mb-btn.red:hover{background:var(--red);color:#fff}
.multi-bar .mb-btn.grey{background:transparent;color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.2)}
.multi-bar .mb-btn.grey:hover{color:#fff;border-color:rgba(255,255,255,.5)}
#sb-list{overflow-y:auto;flex:1;min-height:0}
#sb-list::-webkit-scrollbar{width:4px}
#sb-list::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.li{padding:10px 14px;border-bottom:1px solid var(--card-border);cursor:pointer;border-left:4px solid transparent;transition:background .1s,border-color .1s;position:relative}
.li:hover{background:var(--li-hover)}
.li.on{background:var(--li-active);border-left-color:var(--teal)}
.li-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;gap:5px}
.li-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.li-st{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.li-name{font-weight:700;font-size:16px;color:var(--text-main);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sc{border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}
.li-meta{color:var(--text-sub);font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:18px}
.li-tags{display:flex;gap:3px;flex-wrap:wrap;padding-left:18px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 8px;font-weight:700;border:1px solid transparent}
.ts{background:#e8f8f0;color:var(--green);border-color:var(--green)}
.td{background:#e8f0ff;color:var(--blue);border-color:var(--blue)}
.te{background:var(--light);color:var(--grey)}
.tst{font-size:10px;border-radius:99px;padding:2px 7px;font-weight:700;border:1px solid}
#sb-foot{padding:8px 14px;border-top:1px solid var(--card-border);color:var(--text-sub);font-size:13px;text-align:center;background:var(--sb-foot-bg);flex-shrink:0}
#detail{flex:1;overflow-y:auto;background:var(--detail-bg);padding:18px 28px;min-height:0}
#detail::-webkit-scrollbar{width:5px}
#detail::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.d-inner{max-width:100%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-sub);gap:10px;font-size:15px}
.empty svg{opacity:.2}
.dbar{border-radius:12px;padding:18px 22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.db-left .db-name{color:#fff;font-weight:800;font-size:21.5px;line-height:1.2;margin-bottom:2px}
.db-left .db-email{color:rgba(255,255,255,.7);font-size:14px}
.db-left .db-meta{color:rgba(255,255,255,.55);font-size:14px;margin-top:2px}
.db-right{text-align:right;flex-shrink:0}
.db-score{color:#fff;font-weight:800;font-size:46px;line-height:1}
.db-slbl{color:rgba(255,255,255,.5);font-size:13px}
.db-dec{color:#fff;font-weight:700;font-size:15px;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.action-bar{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.action-bar-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-sub);margin-right:4px;white-space:nowrap}
.action-bar-status{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:auto}
.action-bar-status .st-icon{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.act-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid;font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.act-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.act-btn.green{background:#e8f8f0;color:var(--green);border-color:var(--green)}
.act-btn.green:hover{background:var(--green);color:#fff}
.act-btn.red{background:#fdf0f0;color:var(--red);border-color:var(--red)}
.act-btn.red:hover{background:var(--red);color:#fff}
.act-btn.orange{background:#fef5e8;color:var(--orange);border-color:var(--orange)}
.act-btn.orange:hover{background:var(--orange);color:#fff}
.act-btn.purple{background:#f3effe;color:var(--purple);border-color:var(--purple)}
.act-btn.purple:hover{background:var(--purple);color:#fff}
.act-btn.navy{background:var(--input-bg);color:var(--text-main);border-color:var(--card-border)}
.act-btn.navy:hover{background:var(--teal);color:#061D39}
.card{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);margin-bottom:10px}
.cb{padding:12px 16px}
.clbl{color:var(--text-sub);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ctxt{color:var(--text-main);font-size:16.5px;line-height:1.55}
.cmotif{font-size:17px;font-weight:600;color:var(--text-main)}
.card.motif{border-left:4px solid}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pcard{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);padding:12px 14px}
.plbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.prow{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px}
.pdot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.ptxt{font-size:15px;line-height:1.4;color:var(--text-main)}
.pnone{font-size:15px;font-style:italic;color:var(--text-sub)}
.brow{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.badge{border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.abox{background:var(--navy);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.abox img{filter:brightness(0)invert(1);flex-shrink:0;margin-top:2px}
.albl{color:var(--teal);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.atxt{color:#fff;font-size:15px;line-height:1.5}
.ebox{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);overflow:hidden;margin-bottom:10px}
.ehead{background:var(--navy);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
.elbl{color:var(--teal);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.eto{color:rgba(255,255,255,.35);font-size:13px}
.ebody{padding:14px 16px;color:var(--text-main);font-size:15px;line-height:1.75;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.ebody::-webkit-scrollbar{width:4px}
.ebody::-webkit-scrollbar-thumb{background:var(--pale)}
.sbtn{width:100%;background:var(--teal);color:#061D39;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:16.5px;cursor:pointer;letter-spacing:.04em;font-family:var(--font);transition:opacity .15s,transform .15s}
.sbtn:hover{opacity:.88;transform:translateY(-1px)}
.sconf{background:#e8f8f0;border:1px solid var(--green);border-radius:10px;padding:14px;text-align:center;color:var(--green);font-weight:700;font-size:16.5px}
.view-tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px;margin:0 18px}
.view-tab{padding:5px 16px;border-radius:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.4);font-family:var(--font);transition:all .15s}
.view-tab.on{background:var(--teal);color:var(--navy)}
.view-tab:hover:not(.on){color:rgba(255,255,255,.7)}
#view-list{position:absolute;inset:0;display:flex;flex-direction:row}
#view-list.hidden{display:none}
#view-board{position:absolute;inset:0;overflow:hidden;padding:14px 16px;gap:12px;display:none;flex-direction:row}
#view-board.active{display:flex}
.board-col{flex:1;min-width:0;background:var(--card-bg);border-radius:12px;border:1px solid var(--card-border);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s}
.board-col.drag-over{box-shadow:0 0 0 2px var(--teal);background:#f8fffe}
.board-col-head{padding:12px 14px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.board-col-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-main)}
.board-col-dot{width:10px;height:10px;border-radius:50%}
.board-col-count{font-size:18px;font-weight:800;opacity:.3}
.board-col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.board-col-body::-webkit-scrollbar{width:3px}
.board-col-body::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.bc{background:var(--input-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;cursor:grab;transition:all .15s;position:relative}
.bc:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bc:active{cursor:grabbing;opacity:.8}
.bc.dragging{opacity:.4;transform:scale(.96)}
.bc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:6px}
.bc-name{font-weight:700;font-size:14px;color:var(--text-main);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-score{border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800;flex-shrink:0}
.bc-act{font-size:11px;color:var(--text-sub);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-tags{display:flex;gap:3px;flex-wrap:wrap}
.bc-tags .tag{font-size:9px;padding:1px 6px}
.bc-ia{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:5px;display:inline-block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#061D39;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s ease;pointer-events:none;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
[data-theme="dark"] .toast{background:#1a2d42;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .t-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── v2 : écran de connexion (F1) ─────────────────────────────────────────── */
#login-overlay{position:fixed;inset:0;background:#061D39;z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column}
#login-overlay.cache{display:none}
.login-card{background:#fff;border-radius:16px;padding:38px 42px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
.login-logo svg{width:44px;height:44px}
.login-title{font-size:24px;font-weight:800;color:#061D39;line-height:1.1}
.login-sub{font-size:13px;color:#47d3b0;font-weight:600}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#757575;margin-bottom:5px}
.login-field input{width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid #E4EBF3;font-size:15px;font-family:var(--font);outline:none;background:#F4F6FB;color:#061D39;transition:border .15s}
.login-field input:focus{border-color:#47d3b0}
.login-btn{width:100%;background:#47d3b0;color:#061D39;border:none;border-radius:8px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--font);letter-spacing:.03em;margin-top:6px;transition:opacity .15s}
.login-btn:hover{opacity:.88}
.login-btn:disabled{opacity:.5;cursor:wait}
.login-forgot{display:block;text-align:center;margin-top:14px;font-size:13px;color:#757575;cursor:pointer;text-decoration:underline}
.login-forgot:hover{color:#061D39}
.login-error{margin-top:14px;padding:10px 14px;border-radius:8px;background:#fdf0f0;border:1px solid #e05252;color:#e05252;font-size:13.5px;font-weight:600;display:none}
.login-error.visible{display:block}
.login-info{margin-top:14px;padding:10px 14px;border-radius:8px;background:#e8f8f0;border:1px solid #2ecc71;color:#1d9e54;font-size:13.5px;font-weight:600;display:none}
.login-info.visible{display:block}
.login-footer{margin-top:26px;color:rgba(255,255,255,.35);font-size:12.5px;text-align:center}

/* ── v2 : boutons topbar (synchroniser, déconnexion) ──────────────────────── */
.tb-btn{height:36px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;flex-shrink:0;margin-left:8px;padding:0 14px;color:rgba(255,255,255,.75);font-family:var(--font);font-size:13px;font-weight:700}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Detectus v2 — Lina Capital
   Front vanilla JS + supabase-js (CDN). Aucune donnée métier en localStorage.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Thème (seul usage autorisé de localStorage) ─────────────────────────── */
function toggleTheme(){const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';html.setAttribute('data-theme',isDark?'light':'dark');document.getElementById('theme-icon-sun').style.display=isDark?'none':'block';document.getElementById('theme-icon-moon').style.display=isDark?'block':'none';localStorage.setItem('detectus-theme',isDark?'light':'dark');}
(function(){const saved=localStorage.getItem('detectus-theme');if(saved==='dark'){document.documentElement.setAttribute('data-theme','dark');setTimeout(()=>{document.getElementById('theme-icon-sun').style.display='block';document.getElementById('theme-icon-moon').style.display='none';},0);}})();

/* ── Constantes UI (reprises de la v1) ───────────────────────────────────── */
const C={green:'#2ecc71',orange:'#e08c3a',red:'#e05252',teal:'#47d3b0',blue:'#3c6da4',navy:'#061D39',grey:'#757575',purple:'#8b5cf6'};
const dc=d=>d==="QUALIFIÉ"?C.green:d==="REFUSÉ"?C.red:C.orange;

const ST={
  nouveau:{label:'Nouveau',color:'#aab4c2'},
  info:{label:'Info demandée',color:C.orange},
  pitch:{label:'Attente Pitch',color:C.blue},
  attente:{label:"Liste d'attente",color:C.teal},
  accepte:{label:'Accepté',color:C.green},
  refuse:{label:'Refusé',color:C.red},
};
const ST_ORDER=['nouveau','info','pitch','attente','accepte','refuse'];

const EMAIL_ST={
  info:p=>`Bonjour ${p},\n\nNous avons bien reçu votre dossier et vous remercions de l'intérêt que vous portez à Lina Finance.\n\nAfin de compléter notre analyse, nous aurions besoin des documents suivants :\n— Business plan ou prévisionnel financier\n— Pitch deck ou présentation du projet\n\nNous revenons vers vous rapidement après réception.\n\nCordialement,\nL'Équipe Lina Finance`,
  pitch:p=>`Bonjour ${p},\n\nNous avons bien étudié votre dossier et souhaitons aller plus loin.\n\nNous vous proposons un appel de 30 minutes afin d'échanger sur votre projet et vous présenter nos conditions de financement halal.\n\nPouvez-vous nous indiquer vos disponibilités cette semaine ?\n\nCordialement,\nL'Équipe Lina Finance`,
  attente:p=>`Bonjour ${p},\n\nNous vous remercions pour la qualité de votre présentation.\n\nVotre dossier est intéressant et nous souhaitons le garder en suivi actif. Nous reviendrons vers vous dès qu'une opportunité de financement adaptée se présentera.\n\nN'hésitez pas à nous tenir informés de l'évolution de votre projet.\n\nCordialement,\nL'Équipe Lina Finance`,
  accepte:p=>`Bonjour ${p},\n\nNous sommes heureux de vous informer que votre dossier a été retenu par notre comité.\n\nNous allons vous adresser sous 48h les documents relatifs aux conditions de financement. Un conseiller dédié prendra contact avec vous pour les prochaines étapes.\n\nFélicitations et bienvenue chez Lina Finance.\n\nCordialement,\nL'Équipe Lina Finance`,
  refuse:p=>`Bonjour ${p},\n\nNous vous remercions pour l'intérêt que vous portez à Lina Finance et pour le temps consacré à votre demande.\n\nAprès étude attentive de votre dossier, nous ne sommes malheureusement pas en mesure de donner une suite favorable, en raison de critères propres à notre politique de financement.\n\nNous vous souhaitons plein succès dans votre projet.\n\nCordialement,\nL'Équipe Lina Finance`,
};
const EMAIL_SUBJECTS={info:'Lina Finance — Compléments nécessaires pour votre dossier',pitch:'Lina Finance — Invitation à un appel de présentation',attente:'Lina Finance — Votre dossier est en suivi',accepte:"Lina Finance — Votre dossier est accepté",refuse:'Lina Finance — Suite à votre demande de financement'};
const EMAIL_LABELS={info:'Demande de documents',pitch:'Invitation pitch',attente:"Mise en liste d'attente",accepte:"Confirmation d'acceptation",refuse:'Notification de refus'};

/* ── Client Supabase ─────────────────────────────────────────────────────── */
let sb=null;
(function initialiserClient(){
  try{
    if(typeof CONFIG==='undefined'||!CONFIG.SUPABASE_URL||!CONFIG.SUPABASE_ANON_KEY)throw new Error('config.js manquant ou incomplet');
    sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  }catch(e){
    const err=document.getElementById('login-error');
    err.textContent='Configuration manquante : créez config.js à partir de config.example.js (URL Supabase + anon key).';
    err.classList.add('visible');
  }
})();

/* ── État global ─────────────────────────────────────────────────────────── */
let LEADS=[];
let UTILISATEUR=null;          // utilisateur Supabase Auth connecté
let appDemarree=false;
let filterIA="Tous",filterST="Tous",currentL=null,currentSort="score",selectedIds=new Set();
let dataSource='chargement…';

/* ── Toast générique ─────────────────────────────────────────────────────── */
let minuteurToast=null;
function afficherToast(message,couleur){
  const t=document.getElementById('toast');
  t.querySelector('.t-dot').style.background=couleur||C.teal;
  t.querySelector('.t-msg').textContent=message;
  t.classList.add('show');
  clearTimeout(minuteurToast);
  minuteurToast=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ═══ F1 — Authentification ═══════════════════════════════════════════════ */

function afficherLogin(){
  document.getElementById('login-overlay').classList.remove('cache');
  document.getElementById('login-error').classList.remove('visible');
  document.getElementById('login-info').classList.remove('visible');
}
function masquerLogin(){
  document.getElementById('login-overlay').classList.add('cache');
}

async function connexion(event){
  event.preventDefault();
  if(!sb)return;
  const bouton=document.getElementById('login-btn');
  const erreur=document.getElementById('login-error');
  erreur.classList.remove('visible');
  bouton.disabled=true;bouton.textContent='Connexion…';
  try{
    const email=document.getElementById('login-email').value.trim();
    const motDePasse=document.getElementById('login-password').value;
    const {error}=await sb.auth.signInWithPassword({email,password:motDePasse});
    if(error){
      erreur.textContent=error.message==='Invalid login credentials'
        ?'Email ou mot de passe incorrect.'
        :'Connexion impossible : '+error.message;
      erreur.classList.add('visible');
    }
    // En cas de succès, onAuthStateChange déclenche demarrerApp()
  }catch(e){
    erreur.textContent='Erreur réseau — vérifiez votre connexion.';
    erreur.classList.add('visible');
  }finally{
    bouton.disabled=false;bouton.textContent='Se connecter';
  }
}

async function motDePasseOublie(){
  if(!sb)return;
  const email=document.getElementById('login-email').value.trim();
  const erreur=document.getElementById('login-error');
  const info=document.getElementById('login-info');
  erreur.classList.remove('visible');info.classList.remove('visible');
  if(!email){
    erreur.textContent='Saisissez votre email d\'abord, puis cliquez sur « Mot de passe oublié ».';
    erreur.classList.add('visible');
    return;
  }
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
    if(error)throw error;
    info.textContent='Email de réinitialisation envoyé à '+email+'.';
    info.classList.add('visible');
  }catch(e){
    erreur.textContent='Envoi impossible : '+(e.message||e);
    erreur.classList.add('visible');
  }
}

async function deconnexion(){
  if(!sb)return;
  try{
    await sb.auth.signOut();
    // onAuthStateChange purge l'état et réaffiche le login
  }catch(e){
    afficherToast('Déconnexion impossible : '+(e.message||e),C.red);
  }
}

/* Démarrage : la session pilote tout via onAuthStateChange */
function initialiserAuth(){
  if(!sb)return;
  sb.auth.onAuthStateChange((evenement,session)=>{
    if(session&&!appDemarree){
      appDemarree=true;
      UTILISATEUR=session.user;
      masquerLogin();
      demarrerApp();
    }else if(!session){
      // Déconnexion : purge complète de l'état local (F1)
      appDemarree=false;
      UTILISATEUR=null;
      LEADS=[];currentL=null;selectedIds.clear();
      render();
      afficherLogin();
    }
  });
}

async function demarrerApp(){
  await chargerDeals();
  // La synchro Typeform se lance en arrière-plan au chargement (comme la v1)
  synchroniserTypeform(true);
}

/* ═══ F3/F4 — Données : chargement depuis Postgres ════════════════════════ */

/* Conversion ligne deals (Postgres) → objet lead (format d'affichage v1) */
function dealVersLead(d){
  const dateAffichage=(()=>{
    const brut=d.date_soumission||d.cree_le;
    if(!brut)return '—';
    const dt=new Date(brut);
    return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  })();
  return {
    id:d.id,
    date:dateAffichage,
    prenom:d.prenom||'Inconnu',
    nom:d.nom||'—',
    email:d.email||'',
    act:d.activite||'Non précisée',
    ent:d.entreprise_creee?'Oui':'Non',
    ca:d.ca_tranche||'< 50K',
    desc:d.description||'',
    doc:!!d.document_url,
    docUrl:d.document_url||'',
    tel:d.telephone||'',
    statut:d.statut||'nouveau',
    score:d.score??0,
    dec:d.decision||'À ÉTUDIER',
    motif:d.motif||'',
    forts:Array.isArray(d.points_forts)?d.points_forts:[],
    faibles:Array.isArray(d.points_faibles)?d.points_faibles:[],
    action:d.action_reco||'',
    sante:!!d.sante,
    source:d.source||'typeform',
    // Champs confidentiels (utilisés à partir du Lot 2)
    societe:d.societe,
    montant_demande:d.montant_demande,
    valorisation:d.valorisation,
    montant_investi:d.montant_investi,
    notes_dd:d.notes_dd,
    prochaine_etape:d.prochaine_etape,
    date_prochaine_etape:d.date_prochaine_etape,
  };
}

/* Chargement de tous les dossiers depuis Postgres (remplace le localStorage v1) */
async function chargerDeals(){
  if(!sb||!UTILISATEUR)return;
  try{
    dataSource='chargement…';
    const {data,error}=await sb.from('deals').select('*').order('date_soumission',{ascending:false});
    if(error)throw error;
    LEADS=(data||[]).map(dealVersLead);
    dataSource=`Supabase · ${LEADS.length} dossiers`;
  }catch(e){
    dataSource='Erreur de chargement';
    afficherToast('Chargement des dossiers impossible : '+(e.message||e),C.red);
  }
  render();
}

/* ═══ F4 — Synchronisation Typeform (Edge Function typeform-sync) ═════════ */

let syncEnCours=false;
async function synchroniserTypeform(silencieux){
  if(!sb||!UTILISATEUR||syncEnCours)return;
  syncEnCours=true;
  const bouton=document.getElementById('btn-sync');
  bouton.disabled=true;bouton.classList.add('sync-en-cours');
  try{
    const {data,error}=await sb.functions.invoke('typeform-sync',{body:{}});
    if(error)throw error;
    if(data&&data.erreur)throw new Error(data.erreur);
    if(data&&data.inseres>0){
      await chargerDeals();
      afficherToast(`${data.inseres} nouveau${data.inseres>1?'x':''} dossier${data.inseres>1?'s':''} importé${data.inseres>1?'s':''} depuis Typeform`,C.green);
    }else if(!silencieux){
      afficherToast('Aucun nouveau dossier — tout est à jour',C.teal);
    }
  }catch(e){
    if(!silencieux)afficherToast('Synchronisation Typeform impossible : '+(e.message||e),C.red);
  }finally{
    syncEnCours=false;
    bouton.disabled=false;bouton.classList.remove('sync-en-cours');
  }
}

/* ═══ Changement de statut (écrit dans Postgres) ══════════════════════════ */

async function changerStatut(id,nouveauStatut){
  const lead=LEADS.find(x=>x.id===id);
  if(!lead||!sb)return;
  const ancienStatut=lead.statut;
  // Mise à jour optimiste de l'UI, annulée si l'écriture échoue
  lead.statut=nouveauStatut;
  render();
  try{
    const {error}=await sb.from('deals').update({statut:nouveauStatut}).eq('id',id);
    if(error)throw error;
    afficherToast(`${lead.prenom} ${lead.nom} → ${ST[nouveauStatut].label}`,ST[nouveauStatut].color);
  }catch(e){
    lead.statut=ancienStatut;
    render();
    afficherToast('Changement de statut impossible : '+(e.message||e),C.red);
  }
}

/* Alias v1 conservé (appelé par les boutons d'action et le drag & drop) */
function setStatus(id,st){changerStatut(id,st);}

async function multiAction(nouveauStatut){
  if(!sb)return;
  const ids=[...selectedIds];
  if(!ids.length)return;
  // Mise à jour optimiste
  const anciens={};
  ids.forEach(id=>{const l=LEADS.find(x=>x.id===id);if(l){anciens[id]=l.statut;l.statut=nouveauStatut;}});
  const nb=ids.length;
  selectedIds.clear();renderMultiBar();render();
  try{
    const {error}=await sb.from('deals').update({statut:nouveauStatut}).in('id',ids);
    if(error)throw error;
    afficherToast(`${nb} dossiers → ${ST[nouveauStatut].label}`,ST[nouveauStatut].color);
  }catch(e){
    ids.forEach(id=>{const l=LEADS.find(x=>x.id===id);if(l&&anciens[id])l.statut=anciens[id];});
    render();
    afficherToast('Mise à jour groupée impossible : '+(e.message||e),C.red);
  }
}

/* ═══ UI v1 (rendu) — identique à la v1, ids en chaînes (uuid) ════════════ */

function showPanel(id,tab){document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('on'));document.querySelectorAll('.fpanel').forEach(p=>p.classList.remove('on'));tab.classList.add('on');document.getElementById('panel-'+id).classList.add('on');}
function selectAll(){getVisibleLeads().forEach(l=>selectedIds.add(l.id));renderMultiBar();render();}
function selectByScore(){const min=+document.getElementById('sel-score-min').value||0;const max=+document.getElementById('sel-score-max').value||100;selectedIds.clear();getVisibleLeads().filter(l=>l.score>=min&&l.score<=max).forEach(l=>selectedIds.add(l.id));renderMultiBar();render();}
function selectByDate(){const from=document.getElementById('sel-date-from').value;const to=document.getElementById('sel-date-to').value;if(!from&&!to)return;const fd=from?new Date(from):new Date('2000-01-01');const td=to?new Date(to):new Date('2099-12-31');selectedIds.clear();getVisibleLeads().filter(l=>{const d=parseDate(l.date);return d>=fd&&d<=td}).forEach(l=>selectedIds.add(l.id));renderMultiBar();render();}
function getVisibleLeads(){const q=document.getElementById('sb-search').value.toLowerCase();return LEADS.filter(l=>{const mia=filterIA==="Tous"||(filterIA==="Santé"?l.sante:l.dec===filterIA);const mst=filterST==="Tous"||l.statut===filterST;const ms=!q||`${l.prenom} ${l.nom} ${l.act} ${l.desc}`.toLowerCase().includes(q);return mia&&mst&&ms;});}
function setF(f,btn,group){if(group==='ia'){filterIA=f;document.querySelectorAll('#filters-ia .fb').forEach(b=>b.classList.remove('on'))}else{filterST=f;document.querySelectorAll('#filters-st .fb').forEach(b=>b.classList.remove('on'))}btn.classList.add('on');render();}
function setSort(s,btn){currentSort=s;document.querySelectorAll('#filters-date .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');render();}
function parseDate(d){const[dd,mm,yy]=d.split('/');return new Date(yy,mm-1,dd)}
function sortLeads(list){if(currentSort==='recent')return list.sort((a,b)=>parseDate(b.date)-parseDate(a.date));if(currentSort==='ancien')return list.sort((a,b)=>parseDate(a.date)-parseDate(b.date));return list.sort((a,b)=>b.score-a.score);}
function toggleSelect(id,e){e.stopPropagation();if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);renderMultiBar();render();}
function renderMultiBar(){const bar=document.getElementById('multi-bar');if(selectedIds.size>0){bar.style.display='flex';document.getElementById('mb-count').textContent=selectedIds.size}else{bar.style.display='none'}}
function clearSelection(){selectedIds.clear();renderMultiBar();render()}

function renderKpis(){
  const counts={};ST_ORDER.forEach(k=>counts[k]=0);
  LEADS.forEach(l=>{if(counts[l.statut]!==undefined)counts[l.statut]++});
  document.getElementById('tb-kpis').innerHTML=`
    <div class="kpi"><div class="kpi-val" style="color:#fff">${LEADS.length}</div><div class="kpi-lbl">Dossiers</div></div>
    <div class="kpi-div"></div>
    ${ST_ORDER.map(k=>`<div class="kpi"><div class="kpi-val" style="color:${ST[k].color}">${counts[k]}</div><div class="kpi-lbl">${ST[k].label}</div></div>`).join('')}
  `;
}

function render(){
  renderKpis();
  if(currentView==='board'){renderBoard();return}
  const q=document.getElementById('sb-search').value.toLowerCase();
  let list=LEADS.filter(l=>{const mia=filterIA==="Tous"||(filterIA==="Santé"?l.sante:l.dec===filterIA);const mst=filterST==="Tous"||l.statut===filterST;const ms=!q||`${l.prenom} ${l.nom} ${l.act} ${l.desc}`.toLowerCase().includes(q);return mia&&mst&&ms;});
  list=sortLeads([...list]);
  if(!currentL&&list.length)currentL=list[0];
  if(currentL&&!list.find(l=>l.id===currentL.id)&&list.length)currentL=list[0];
  document.getElementById('sb-list').innerHTML=list.map(l=>{const s=ST[l.statut],sel=selectedIds.has(l.id);return `<div class="li${currentL?.id===l.id?' on':''}" onclick="pick('${l.id}')"><div class="li-top"><div class="li-left"><div class="li-check${sel?' checked':''}" onclick="toggleSelect('${l.id}',event)">${sel?'✓':''}</div><div class="li-st" style="background:${s.color}${l.statut==='nouveau'?'44':''};border-color:${s.color}" title="${s.label}"></div><div class="li-name">${l.prenom} ${l.nom}</div></div><div class="li-sc" style="background:${dc(l.dec)}22;color:${dc(l.dec)};border:1px solid ${dc(l.dec)}">${l.score}</div></div><div class="li-meta" style="padding-left:42px">${l.act} · ${l.date}</div><div class="li-tags" style="padding-left:42px">${l.statut!=='nouveau'?`<span class="tst" style="background:${s.color}18;color:${s.color};border-color:${s.color}">${s.label}</span>`:''}${l.sante?'<span class="tag ts">Santé</span>':''}${l.doc?'<span class="tag td">Doc</span>':''}</div></div>`;}).join('');
  document.getElementById('sb-foot').textContent=`${list.length} dossier${list.length>1?'s':''} · ${LEADS.length} total · ${dataSource}`;
  renderMultiBar();
  renderDetail();
}

function pick(id){currentL=LEADS.find(l=>l.id===id);render()}

function actionButtons(l){
  const s=l.statut,id=l.id;
  if(s==='nouveau')return`<button class="act-btn orange" onclick="setStatus('${id}','info')">Demander info</button><button class="act-btn purple" onclick="setStatus('${id}','pitch')">Planifier pitch</button><button class="act-btn red" onclick="setStatus('${id}','refuse')">Refuser</button>`;
  if(s==='info')return`<button class="act-btn purple" onclick="setStatus('${id}','pitch')">Doc reçu — Planifier pitch</button><button class="act-btn orange" onclick="relance('${id}')">Relancer</button><button class="act-btn red" onclick="setStatus('${id}','refuse')">Refuser</button>`;
  if(s==='pitch')return`<button class="act-btn green" onclick="setStatus('${id}','accepte')">Accepter</button><button class="act-btn navy" onclick="setStatus('${id}','attente')">Liste d'attente</button><button class="act-btn red" onclick="setStatus('${id}','refuse')">Refuser</button>`;
  if(s==='attente')return`<button class="act-btn purple" onclick="setStatus('${id}','pitch')">Replanifier pitch</button><button class="act-btn red" onclick="setStatus('${id}','refuse')">Refuser</button>`;
  if(s==='accepte'||s==='refuse')return`<button class="act-btn navy" onclick="setStatus('${id}','nouveau')">Réouvrir le dossier</button>`;
  return '';
}

function relance(id){const l=LEADS.find(x=>x.id===id);if(!l)return;afficherToast(`Relance envoyée → ${l.prenom} ${l.nom}`,C.orange);}

function mailtoLink(l){const st=l.statut,tpl=EMAIL_ST[st];if(!tpl)return null;const subj=encodeURIComponent(EMAIL_SUBJECTS[st]||'Lina Finance');const body=encodeURIComponent(tpl(l.prenom));return `mailto:${l.email}?subject=${subj}&body=${body}`;}

function emailBlock(l){const st=l.statut;if(st==='nouveau')return '';const tpl=EMAIL_ST[st];if(!tpl)return '';const href=mailtoLink(l);return `<div class="ebox"><div class="ehead"><span class="elbl">${EMAIL_LABELS[st]||'Email'}</span><span class="eto">→ ${l.email}</span></div><div class="ebody">${tpl(l.prenom)}</div></div><a href="${href}" class="sbtn" style="display:block;text-align:center;text-decoration:none">✉  Ouvrir dans ma messagerie</a>`;}

function renderDetail(){
  const l=currentL;
  document.getElementById('empty').style.display=l?'none':'flex';
  const di=document.getElementById('d-inner');
  if(!l){di.style.display='none';return}
  di.style.display='block';
  const col=dc(l.dec),s=ST[l.statut];
  di.innerHTML=`
    <div class="dbar" style="background:${col}">
      <div class="db-left"><div class="db-name">${l.prenom} ${l.nom}</div><div class="db-email">${l.email} · ${l.date}</div><div class="db-meta">${l.act} · Entreprise : ${l.ent} · CA : ${l.ca}</div></div>
      <div class="db-right"><div class="db-score">${l.score}</div><div class="db-slbl">/100</div><div class="db-dec">${l.dec}</div></div>
    </div>
    <div class="action-bar">
      <div class="action-bar-label">Traitement</div>
      <div class="action-bar-status" style="background:${s.color}18;color:${s.color};border:2px solid ${s.color}"><span class="st-icon" style="background:${s.color}"></span>${s.label}</div>
      ${actionButtons(l)}
    </div>
    <div class="card"><div class="cb"><div class="clbl">Projet</div><div class="ctxt">${l.desc||'<i>Aucune description</i>'}</div></div></div>
    <div class="card motif" style="border-left-color:${col}"><div class="cb"><div class="clbl">Analyse IA</div><div class="cmotif">${l.motif}</div></div></div>
    <div class="pgrid">
      <div class="pcard"><div class="plbl" style="color:${C.green}">Points forts</div>${l.forts.length?l.forts.map(p=>`<div class="prow"><div class="pdot" style="background:${C.green}"></div><div class="ptxt">${p}</div></div>`).join(''):'<div class="pnone">Aucun</div>'}</div>
      <div class="pcard"><div class="plbl" style="color:${C.red}">Points faibles</div>${l.faibles.length?l.faibles.map(p=>`<div class="prow"><div class="pdot" style="background:${C.red}"></div><div class="ptxt">${p}</div></div>`).join(''):'<div class="pnone">Aucun</div>'}</div>
    </div>
    <div class="brow">
      <span class="badge" style="background:${l.doc?'#e8f8f0':'#fdf0f0'};color:${l.doc?C.green:C.red};border-color:${l.doc?C.green:C.red}">${l.doc?'✓ Document fourni':'✗ Document manquant'}</span>
      ${l.sante?`<span class="badge" style="background:#e8f8f0;color:${C.green};border-color:${C.green}">Secteur santé ✓</span>`:''}
      <span class="badge" style="background:var(--light);color:var(--grey);border-color:var(--pale)">Entreprise : ${l.ent}</span>
      <span class="badge" style="background:var(--light);color:var(--grey);border-color:var(--pale)">CA : ${l.ca}</span>
    </div>
    <div class="abox"><div><div class="albl">Action recommandée</div><div class="atxt">${l.action}</div></div></div>
    ${emailBlock(l)}
  `;
}

/* ── Redimensionnement de la sidebar (v1) ────────────────────────────────── */
(function(){const handle=document.getElementById('resize-handle');const sidebar=document.getElementById('sidebar');let dragging=false,startX,startW;handle.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;handle.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});document.addEventListener('mousemove',e=>{if(!dragging)return;const w=Math.min(Math.max(startW+(e.clientX-startX),200),600);sidebar.style.width=w+'px';});document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;handle.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';});})();

/* ── Vue Board Kanban (v1, ids en chaînes) ───────────────────────────────── */
let currentView='list';
function switchView(v,btn){currentView=v;document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');document.getElementById('view-list').classList.toggle('hidden',v==='board');document.getElementById('view-board').classList.toggle('active',v==='board');if(v==='board')renderBoard();}

function renderBoard(){
  const board=document.getElementById('view-board');
  board.innerHTML=ST_ORDER.map(st=>{
    const s=ST[st];
    const items=LEADS.filter(l=>l.statut===st).sort((a,b)=>b.score-a.score);
    return `<div class="board-col" data-col="${st}" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event,'${st}')"><div class="board-col-head"><div class="board-col-title"><div class="board-col-dot" style="background:${s.color}"></div>${s.label}</div><div class="board-col-count">${items.length}</div></div><div class="board-col-body">${items.map(l=>{const col=dc(l.dec);return `<div class="bc" draggable="true" data-id="${l.id}" ondragstart="boardDragStart(event,'${l.id}')" ondragend="boardDragEnd(event)" onclick="boardClick('${l.id}')"><div class="bc-top"><div class="bc-name">${l.prenom} ${l.nom}</div><div class="bc-score" style="background:${col}22;color:${col};border:1px solid ${col}">${l.score}</div></div><div class="bc-act">${l.act} · ${l.date}</div><div class="bc-tags">${l.sante?'<span class="tag ts">Santé</span>':''}${l.doc?'<span class="tag td">Doc</span>':''}</div><div class="bc-ia" style="background:${col}15;color:${col}">${l.dec}</div></div>`;}).join('')}</div></div>`;
  }).join('');
}

let dragId=null;
function boardDragStart(e,id){dragId=id;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function boardDragEnd(e){e.target.classList.remove('dragging');dragId=null;document.querySelectorAll('.board-col').forEach(c=>c.classList.remove('drag-over'))}
function boardDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')}
function boardDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function boardDrop(e,st){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(dragId!==null){setStatus(dragId,st);renderBoard()}}
function boardClick(id){currentL=LEADS.find(l=>l.id===id);switchView('list',document.querySelectorAll('.view-tab')[0]);render();}

/* ── Navigation clavier j/k (v1) ─────────────────────────────────────────── */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const vis=getVisibleLeads();if(!vis.length)return;const idx=currentL?vis.findIndex(l=>l.id===currentL.id):-1;if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();pick(vis[Math.min(idx+1,vis.length-1)].id)}if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();pick(vis[Math.max(idx-1,0)].id)}});

/* ── Démarrage ───────────────────────────────────────────────────────────── */
initialiserAuth();
render();
</script>
</body>
</html>
