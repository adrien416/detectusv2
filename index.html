<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>Detectus · Lina Finance</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23061D39'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%236B7A8D' stroke-width='5' stroke-linecap='round' stroke-dasharray='95 18'/%3E%3Crect x='24' y='24' width='16' height='16' rx='3' transform='rotate(45 32 32)' fill='%2347d3b0'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
:root{--navy:#061D39;--blue:#3c6da4;--pale:#E4EBF3;--teal:#47d3b0;--grey:#757575;--light:#F4F6FB;--white:#fff;--red:#e05252;--orange:#e08c3a;--green:#2ecc71;--purple:#8b5cf6;--font:'DM Sans',system-ui,sans-serif;--topbar-bg:#061D39;--sidebar-bg:#fff;--detail-bg:#F4F6FB;--card-bg:#fff;--card-border:#E4EBF3;--text-main:#061D39;--text-sub:#757575;--input-bg:#F4F6FB;--sb-foot-bg:#fafbfd;--li-hover:#f8f9fc;--li-active:#F4F6FB;--logo-circle:#061D39;--logo-circle-opacity:1;}
[data-theme="dark"]{--navy:#e8ecf2;--pale:#2a3548;--light:#0d1a2b;--white:#111d2e;--grey:#8899aa;--topbar-bg:#0a1322;--sidebar-bg:#111d2e;--detail-bg:#0d1a2b;--card-bg:#162236;--card-border:#253448;--text-main:#e8ecf2;--text-sub:#8899aa;--input-bg:#162236;--sb-foot-bg:#0f1926;--li-hover:#1a2d42;--li-active:#1a2d42;--logo-circle:#6B7A8D;--logo-circle-opacity:.7;}
body{font-family:var(--font);background:var(--detail-bg);display:flex;flex-direction:column;font-size:16.5px;color:var(--text-main)}
#topbar{background:var(--topbar-bg);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:54px;flex-shrink:0;border-bottom:1px solid rgba(71,211,176,.15);}
.tb-brand{display:flex;align-items:center;gap:11px}
.tb-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-logo svg{width:36px;height:36px}
.tb-title{color:#fff;font-weight:800;font-size:18.5px;line-height:1.1}
.tb-sub{color:var(--teal);font-size:13px;opacity:.8;font-weight:500}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:8px}
.theme-toggle:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.theme-toggle svg{width:18px;height:18px;color:rgba(255,255,255,.6);transition:color .2s}
.theme-toggle:hover svg{color:#fff}
.tb-kpis{display:flex;align-items:center;gap:6px}
.kpi{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 14px}
.kpi-val{font-weight:800;font-size:23px;line-height:1}
.kpi-lbl{font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi-div{width:1px;height:30px;background:rgba(255,255,255,.12);margin:0 4px}
#body{flex:1;overflow:hidden;min-height:0;position:relative}
#sidebar{width:340px;flex-shrink:0;background:var(--sidebar-bg);border-right:none;display:flex;flex-direction:column;overflow:hidden;position:relative}
#resize-handle{width:5px;position:absolute;top:0;right:0;bottom:0;cursor:col-resize;background:var(--card-border);transition:background .15s;z-index:10}
#resize-handle:hover,#resize-handle.dragging{background:var(--teal)}
#sb-top{padding:12px 14px;border-bottom:1px solid var(--pale);flex-shrink:0}
.sw{position:relative;margin-bottom:8px}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.3;pointer-events:none}
#sb-search{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1.5px solid var(--card-border);font-size:15px;outline:none;color:var(--text-main);background:var(--input-bg);font-family:var(--font);transition:border .15s}
#sb-search:focus{border-color:var(--teal)}
.ftabs{display:flex;border-bottom:2px solid var(--card-border);margin-bottom:8px}
.ftab{flex:1;text-align:center;padding:7px 4px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;white-space:nowrap}
.ftab:hover{color:var(--text-main)}
.ftab.on{color:var(--teal);border-bottom-color:var(--teal)}
.fpanel{display:none}
.fpanel.on{display:block}
.sb-filters{display:flex;gap:4px;flex-wrap:wrap}
.fb{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.03em;cursor:pointer;border:none;background:var(--input-bg);color:var(--text-sub);font-family:var(--font);transition:all .15s}
.fb.on{background:var(--teal);color:#061D39}
.sel-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sel-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--card-border);background:var(--card-bg);color:var(--text-sub);font-family:var(--font);transition:all .12s}
.sel-btn:hover{border-color:var(--teal);color:var(--text-main)}
.sel-range{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-sub)}
.sel-range input{width:70px;padding:3px 6px;border:1.5px solid var(--card-border);border-radius:5px;font-size:11px;font-family:var(--font);outline:none;color:var(--text-main);background:var(--input-bg)}
.sel-range input:focus{border-color:var(--teal)}
.li-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--card-border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;font-size:10px;color:#fff}
.li-check.checked{background:var(--teal);border-color:var(--teal)}
.multi-bar{background:var(--topbar-bg);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(71,211,176,.15)}
.multi-bar .mb-count{color:var(--teal);font-weight:800;font-size:14px}
.multi-bar .mb-label{color:rgba(255,255,255,.5);font-size:12px}
.multi-bar .mb-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid;font-family:var(--font)}
.multi-bar .mb-btn.orange{background:transparent;color:var(--orange);border-color:var(--orange)}
.multi-bar .mb-btn.orange:hover{background:var(--orange);color:#fff}
.multi-bar .mb-btn.purple{background:transparent;color:var(--purple);border-color:var(--purple)}
.multi-bar .mb-btn.purple:hover{background:var(--purple);color:#fff}
.multi-bar .mb-btn.red{background:transparent;color:var(--red);border-color:var(--red)}
.multi-bar .mb-btn.red:hover{background:var(--red);color:#fff}
.multi-bar .mb-btn.grey{background:transparent;color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.2)}
.multi-bar .mb-btn.grey:hover{color:#fff;border-color:rgba(255,255,255,.5)}
#sb-list{overflow-y:auto;flex:1;min-height:0}
#sb-list::-webkit-scrollbar{width:4px}
#sb-list::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.li{padding:10px 14px;border-bottom:1px solid var(--card-border);cursor:pointer;border-left:4px solid transparent;transition:background .1s,border-color .1s;position:relative}
.li:hover{background:var(--li-hover)}
.li.on{background:var(--li-active);border-left-color:var(--teal)}
.li-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;gap:5px}
.li-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.li-st{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid transparent}
.li-name{font-weight:700;font-size:16px;color:var(--text-main);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sc{border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}
.li-meta{color:var(--text-sub);font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:18px}
.li-tags{display:flex;gap:3px;flex-wrap:wrap;padding-left:18px}
.tag{font-size:11.5px;border-radius:99px;padding:2px 8px;font-weight:700;border:1px solid transparent}
.ts{background:#e8f8f0;color:var(--green);border-color:var(--green)}
.td{background:#e8f0ff;color:var(--blue);border-color:var(--blue)}
.te{background:var(--light);color:var(--grey)}
.tst{font-size:10px;border-radius:99px;padding:2px 7px;font-weight:700;border:1px solid}
#sb-foot{padding:8px 14px;border-top:1px solid var(--card-border);color:var(--text-sub);font-size:13px;text-align:center;background:var(--sb-foot-bg);flex-shrink:0}
#detail{flex:1;overflow-y:auto;background:var(--detail-bg);padding:18px 28px;min-height:0}
#detail::-webkit-scrollbar{width:5px}
#detail::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.d-inner{max-width:100%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-sub);gap:10px;font-size:15px}
.empty svg{opacity:.2}
.dbar{border-radius:12px;padding:18px 22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.db-left .db-name{color:#fff;font-weight:800;font-size:21.5px;line-height:1.2;margin-bottom:2px}
.db-left .db-email{color:rgba(255,255,255,.7);font-size:14px}
.db-left .db-meta{color:rgba(255,255,255,.55);font-size:14px;margin-top:2px}
.db-right{text-align:right;flex-shrink:0}
.db-score{color:#fff;font-weight:800;font-size:46px;line-height:1}
.db-slbl{color:rgba(255,255,255,.5);font-size:13px}
.db-dec{color:#fff;font-weight:700;font-size:15px;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.action-bar{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.action-bar-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-sub);margin-right:4px;white-space:nowrap}
.action-bar-status{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:auto}
.action-bar-status .st-icon{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.act-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:2px solid;font-family:var(--font);transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.act-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.act-btn.green{background:#e8f8f0;color:var(--green);border-color:var(--green)}
.act-btn.green:hover{background:var(--green);color:#fff}
.act-btn.red{background:#fdf0f0;color:var(--red);border-color:var(--red)}
.act-btn.red:hover{background:var(--red);color:#fff}
.act-btn.orange{background:#fef5e8;color:var(--orange);border-color:var(--orange)}
.act-btn.orange:hover{background:var(--orange);color:#fff}
.act-btn.purple{background:#f3effe;color:var(--purple);border-color:var(--purple)}
.act-btn.purple:hover{background:var(--purple);color:#fff}
.act-btn.navy{background:var(--input-bg);color:var(--text-main);border-color:var(--card-border)}
.act-btn.navy:hover{background:var(--teal);color:#061D39}
.card{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);margin-bottom:10px}
.cb{padding:12px 16px}
.clbl{color:var(--text-sub);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ctxt{color:var(--text-main);font-size:16.5px;line-height:1.55}
.cmotif{font-size:17px;font-weight:600;color:var(--text-main)}
.card.motif{border-left:4px solid}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pcard{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);padding:12px 14px}
.plbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.prow{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px}
.pdot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.ptxt{font-size:15px;line-height:1.4;color:var(--text-main)}
.pnone{font-size:15px;font-style:italic;color:var(--text-sub)}
.brow{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.badge{border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.abox{background:var(--navy);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.abox img{filter:brightness(0)invert(1);flex-shrink:0;margin-top:2px}
.albl{color:var(--teal);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.atxt{color:#fff;font-size:15px;line-height:1.5}
.ebox{background:var(--card-bg);border-radius:10px;border:1px solid var(--card-border);overflow:hidden;margin-bottom:10px}
.ehead{background:var(--navy);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
.elbl{color:var(--teal);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.eto{color:rgba(255,255,255,.35);font-size:13px}
.ebody{padding:14px 16px;color:var(--text-main);font-size:15px;line-height:1.75;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.ebody::-webkit-scrollbar{width:4px}
.ebody::-webkit-scrollbar-thumb{background:var(--pale)}
.sbtn{width:100%;background:var(--teal);color:#061D39;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:16.5px;cursor:pointer;letter-spacing:.04em;font-family:var(--font);transition:opacity .15s,transform .15s}
.sbtn:hover{opacity:.88;transform:translateY(-1px)}
.sconf{background:#e8f8f0;border:1px solid var(--green);border-radius:10px;padding:14px;text-align:center;color:var(--green);font-weight:700;font-size:16.5px}
.view-tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px;margin:0 18px}
.view-tab{padding:5px 16px;border-radius:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.4);font-family:var(--font);transition:all .15s}
.view-tab.on{background:var(--teal);color:var(--navy)}
.view-tab:hover:not(.on){color:rgba(255,255,255,.7)}
#view-list{position:absolute;inset:0;display:flex;flex-direction:row}
#view-list.hidden{display:none}
#view-board{position:absolute;inset:0;overflow:hidden;padding:14px 16px;gap:12px;display:none;flex-direction:row}
#view-board.active{display:flex}
.board-col{flex:1;min-width:0;background:var(--card-bg);border-radius:12px;border:1px solid var(--card-border);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s}
.board-col.drag-over{box-shadow:0 0 0 2px var(--teal);background:#f8fffe}
.board-col-head{padding:12px 14px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.board-col-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-main)}
.board-col-dot{width:10px;height:10px;border-radius:50%}
.board-col-count{font-size:18px;font-weight:800;opacity:.3}
.board-col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.board-col-body::-webkit-scrollbar{width:3px}
.board-col-body::-webkit-scrollbar-thumb{background:var(--pale);border-radius:99px}
.bc{background:var(--input-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px 12px;cursor:grab;transition:all .15s;position:relative}
.bc:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bc:active{cursor:grabbing;opacity:.8}
.bc.dragging{opacity:.4;transform:scale(.96)}
.bc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:6px}
.bc-name{font-weight:700;font-size:14px;color:var(--text-main);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-score{border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800;flex-shrink:0}
.bc-act{font-size:11px;color:var(--text-sub);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-tags{display:flex;gap:3px;flex-wrap:wrap}
.bc-tags .tag{font-size:9px;padding:1px 6px}
.bc-ia{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-top:5px;display:inline-block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#061D39;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s ease;pointer-events:none;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
[data-theme="dark"] .toast{background:#1a2d42;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .t-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-brand">
    <div class="tb-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="20" stroke="var(--logo-circle)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="100 20" opacity="var(--logo-circle-opacity)"/>
        <rect x="24" y="24" width="16" height="16" rx="3" transform="rotate(45 32 32)" fill="#47d3b0"/>
      </svg>
    </div>
    <div>
      <div class="tb-title">Detectus</div>
      <div class="tb-sub">by Lina Finance · Jan – Mars 2026</div>
    </div>
  </div>
  <div class="view-tabs">
    <button class="view-tab on" onclick="switchView('list',this)">Liste</button>
    <button class="view-tab" onclick="switchView('board',this)">Board</button>
  </div>
  <div class="tb-kpis" id="tb-kpis"></div>
  <button class="theme-toggle" onclick="toggleTheme()" title="Mode sombre / clair" id="theme-btn">
    <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<div id="body">
  <div id="view-list">
  <div id="sidebar">
    <div id="resize-handle"></div>
    <div id="sb-top">
      <div class="sw">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--text-sub)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="sb-search" type="text" placeholder="Rechercher…" oninput="render()">
      </div>
      <div class="ftabs">
        <div class="ftab on" onclick="showPanel('ia',this)">Detectus</div>
        <div class="ftab" onclick="showPanel('st',this)">Backlog</div>
        <div class="ftab" onclick="showPanel('tri',this)">Tri</div>
        <div class="ftab" onclick="showPanel('sel',this)">Selection</div>
      </div>
      <div class="fpanel on" id="panel-ia">
        <div class="sb-filters" id="filters-ia">
          <button class="fb on" onclick="setF('Tous',this,'ia')">Tous</button>
          <button class="fb" onclick="setF('QUALIFIÉ',this,'ia')">A appeler</button>
          <button class="fb" onclick="setF('À ÉTUDIER',this,'ia')">Pas d'avis</button>
          <button class="fb" onclick="setF('REFUSÉ',this,'ia')">A refuser</button>
          <button class="fb" onclick="setF('Santé',this,'ia')">Santé</button>

function autoScore(l){
  let s=30;
  if(SECTEURS_REFUSES.some(x=>l.act.toLowerCase().includes(x.toLowerCase())))return{score:5,dec:'REFUSÉ',motif:`Activité ${l.act} — secteur exclu par Lina Finance`,forts:[],faibles:[`Secteur ${l.act} exclu`],action:`Refus — ${l.act} exclu`};
  const sante=SECTEURS_SANTE.some(x=>(l.act+' '+l.desc).toLowerCase().includes(x.toLowerCase()));
  if(sante)s+=25;
  if(l.ent==='Oui')s+=15;
  if(l.ca==='+ 50K')s+=15;
  if(l.doc)s+=10;
  if(l.desc.length>150)s+=5;
  s=Math.min(s,100);
  const dec=s>=65?'QUALIFIÉ':s<=20?'REFUSÉ':'À ÉTUDIER';
  const forts=[],faibles=[];
  if(sante)forts.push('Secteur santé (priorité Lina)');
  if(l.ent==='Oui')forts.push('Entreprise existante');else faibles.push('Entreprise non créée');
  if(l.ca==='+ 50K')forts.push('CA positif');else faibles.push('CA faible ou nul');
  if(l.doc)forts.push('Document fourni');else faibles.push('Aucun document');
  if(l.desc.length>150)forts.push('Description détaillée');
  if(l.desc.length<50)faibles.push('Description trop courte');
  const motif=dec==='QUALIFIÉ'?`Dossier solide — ${l.act}, à qualifier en priorité`:dec==='REFUSÉ'?`Dossier insuffisant — critères non remplis`:`À analyser — ${forts.length?forts[0]:'potentiel à confirmer'}`;
  const action=dec==='QUALIFIÉ'?`Appel prioritaire — ${l.prenom} ${l.nom}`:dec==='REFUSÉ'?'Refus — critères insuffisants':'Demander un complément avant traitement';
  return{score:s,dec,motif,forts,faibles,action,sante};
}

/* ── MAPPING CHAMPS PAR REF (formulaire pUE5Jgae) ──── */
function parseTypeformAnswers(answers){
  const map={};
  if(!answers)return map;
  answers.forEach(a=>{
    const key=a.field?.ref||a.field?.id||'';
    if(!key)return;
    switch(a.type){
      case 'text':case 'short_text':case 'long_text':map[key]=a.text||'';break;
      case 'choice':map[key]=a.choice?.label||'';break;
      case 'choices':map[key]=(a.choices?.labels||[]).join(', ');break;
      case 'email':map[key]=a.email||'';break;
      case 'phone_number':map[key]=a.phone_number||'';break;
      case 'file_url':case 'file_upload':map[key]=a.file_url||'';break;
      case 'boolean':map[key]=a.boolean?'Oui':'Non';break;
      case 'number':map[key]=String(a.number||'');break;
      case 'url':map[key]=a.url||'';break;
      default:map[key]=String(a[a.type]||'');break;
    }
  });
  return map;
}

function typeformToLead(r,idx){
  const a=r.answers;
  // Refs du formulaire pUE5Jgae (identifiés depuis l'API)
  const prenom=(a['7cb1e3c9-8bbb-498f-94f6-fe6f2952db05']||'').trim()||'Inconnu';
  const nom=(a['e19aadcb-cdcf-4d59-b5c8-e6f64f61ecb1']||'').trim()||'—';
  const email=a['a24b51ec-27e0-41c8-afe6-26fc9d28968e']||'';
  const act=a['b0d255f7-aae6-40e1-ad69-c6f508242778']||'Non précisée';
  const ent=(a['fc05b640-ec8e-4923-80ac-27298f319e3e']||'').startsWith('Oui')?'Oui':'Non';
  const caRaw=a['48916931-9ca2-4010-9427-b99f4ceab42e']||'';
  const ca=caRaw.includes('50K')||caRaw.includes('50k')?(caRaw.includes('+')?'+ 50K':'< 50K'):'< 50K';
  const desc=a['5dc89ab4-1f65-4fed-a1bd-4e57e36856bd']||'';
  const docUrl=a['946de8c4-6455-426f-a039-4b38f1ebdd36']||'';
  const doc=!!docUrl&&docUrl.startsWith('http');
  const tel=a['96c42553-d4d5-44aa-b088-07c5894a5c07']||'';
  const d=new Date(r.submitted_at);
  const date=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const base={id:idx+1,date,prenom,nom,email,act,ent,ca,desc,doc,tel,docUrl,statut:'nouveau'};
  const ai=autoScore(base);
  return{...base,...ai,sante:ai.sante||false};
}

let LEADS=[];

async function loadLeads(){
  try{
    const savedStatuts=JSON.parse(localStorage.getItem('detectus-statuts')||'{}');
    let allItems=[],before=null,hasMore=true,pages=0;
    while(hasMore&&pages<5){
      const url=`${PROXY_URL}/?page_size=200${before?'&before='+before:''}`;
      const res=await fetch(url);
      if(!res.ok)throw new Error(`Proxy ${res.status}`);
      const data=await res.json();
      const items=data.items||[];
      allItems=[...allItems,...items];
      pages++;
      hasMore=items.length===200;
      if(hasMore)before=items[items.length-1].token;
    }
    LEADS=allItems.map((r,i)=>{
      const lead=typeformToLead({...r,answers:parseTypeformAnswers(r.answers)},i);
      if(savedStatuts[lead.email])lead.statut=savedStatuts[lead.email];
      return lead;
    });
    dataSource=`Typeform · ${LEADS.length} leads`;
  }catch(e){
    console.warn('⚠️ Typeform indisponible, données de démo',e);
    LEADS=FALLBACK_LEADS;
    dataSource='Données de démo (API indisponible)';
  }
  render();
}

}

    <div class="dbar" style="background:${col}">
      <div class="db-left"><div class="db-name">${l.prenom} ${l.nom}</div><div class="db-email">${l.email} · ${l.date}</div><div class="db-meta">${l.act} · Entreprise : ${l.ent} · CA : ${l.ca}</div></div>
      <div class="db-right"><div class="db-score">${l.score}</div><div class="db-slbl">/100</div><div class="db-dec">${l.dec}</div></div>
    </div>
    <div class="action-bar">
      <div class="action-bar-label">Traitement</div>
      <div class="action-bar-status" style="background:${s.color}18;color:${s.color};border:2px solid ${s.color}"><span class="st-icon" style="background:${s.color}"></span>${s.label}</div>
      ${actionButtons(l)}
    </div>
    <div class="card"><div class="cb"><div class="clbl">Projet</div><div class="ctxt">${l.desc}</div></div></div>
    <div class="card motif" style="border-left-color:${col}"><div class="cb"><div class="clbl">Analyse IA</div><div class="cmotif">${l.motif}</div></div></div>
    <div class="pgrid">
      <div class="pcard"><div class="plbl" style="color:${C.green}">Points forts</div>${l.forts.length?l.forts.map(p=>`<div class="prow"><div class="pdot" style="background:${C.green}"></div><div class="ptxt">${p}</div></div>`).join(''):'<div class="pnone">Aucun</div>'}</div>
      <div class="pcard"><div class="plbl" style="color:${C.red}">Points faibles</div>${l.faibles.length?l.faibles.map(p=>`<div class="prow"><div class="pdot" style="background:${C.red}"></div><div class="ptxt">${p}</div></div>`).join(''):'<div class="pnone">Aucun</div>'}</div>
    </div>
    <div class="brow">
      <span class="badge" style="background:${l.doc?'#e8f8f0':'#fdf0f0'};color:${l.doc?C.green:C.red};border-color:${l.doc?C.green:C.red}">${l.doc?'✓ Document fourni':'✗ Document manquant'}</span>
      ${l.sante?`<span class="badge" style="background:#e8f8f0;color:${C.green};border-color:${C.green}">Secteur santé ✓</span>`:''}
      <span class="badge" style="background:var(--light);color:var(--grey);border-color:var(--pale)">Entreprise : ${l.ent}</span>
      <span class="badge" style="background:var(--light);color:var(--grey);border-color:var(--pale)">CA : ${l.ca}</span>
    </div>
    <div class="abox"><img src="https://cdn-icons-png.flaticon.com/512/1250/1250689.png" width="12" height="12" alt=""><div><div class="albl">Action recommandée par l'IA</div><div class="atxt">${l.action}</div></div></div>
    ${emailBlock(l)}
  `;
}

(function(){const handle=document.getElementById('resize-handle');const sidebar=document.getElementById('sidebar');let dragging=false,startX,startW;handle.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;handle.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});document.addEventListener('mousemove',e=>{if(!dragging)return;const w=Math.min(Math.max(startW+(e.clientX-startX),200),600);sidebar.style.width=w+'px';});document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;handle.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';});})();

let currentView='list';
function switchView(v,btn){currentView=v;document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');document.getElementById('view-list').classList.toggle('hidden',v==='board');document.getElementById('view-board').classList.toggle('active',v==='board');if(v==='board')renderBoard();}

function renderBoard(){
  const board=document.getElementById('view-board');
  board.innerHTML=ST_ORDER.map(st=>{
    const s=ST[st];
    const items=LEADS.filter(l=>l.statut===st).sort((a,b)=>b.score-a.score);
    return `<div class="board-col" data-col="${st}" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event,'${st}')"><div class="board-col-head"><div class="board-col-title"><div class="board-col-dot" style="background:${s.color}"></div>${s.label}</div><div class="board-col-count">${items.length}</div></div><div class="board-col-body">${items.map(l=>{const col=dc(l.dec);return `<div class="bc" draggable="true" data-id="${l.id}" ondragstart="boardDragStart(event,${l.id})" ondragend="boardDragEnd(event)" onclick="boardClick(${l.id})"><div class="bc-top"><div class="bc-name">${l.prenom} ${l.nom}</div><div class="bc-score" style="background:${col}22;color:${col};border:1px solid ${col}">${l.score}</div></div><div class="bc-act">${l.act} · ${l.date}</div><div class="bc-tags">${l.sante?'<span class="tag ts">Santé</span>':''}${l.doc?'<span class="tag td">Doc</span>':''}</div><div class="bc-ia" style="background:${col}15;color:${col}">${l.dec}</div></div>`;}).join('')}</div></div>`;
  }).join('');
}

let dragId=null;
function boardDragStart(e,id){dragId=id;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function boardDragEnd(e){e.target.classList.remove('dragging');dragId=null;document.querySelectorAll('.board-col').forEach(c=>c.classList.remove('drag-over'))}
function boardDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')}
function boardDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function boardDrop(e,st){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(dragId!==null){setStatus(dragId,st);renderBoard()}}
function boardClick(id){currentL=LEADS.find(l=>l.id===id);switchView('list',document.querySelectorAll('.view-tab')[0]);render();}

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const vis=LEADS.filter(l=>{const mia=filterIA==="Tous"||(filterIA==="Santé"?l.sante:l.dec===filterIA);const mst=filterST==="Tous"||l.statut===filterST;return mia&&mst;});if(!vis.length)return;const idx=currentL?vis.findIndex(l=>l.id===currentL.id):-1;if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();pick(vis[Math.min(idx+1,vis.length-1)].id)}if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();pick(vis[Math.max(idx-1,0)].id)}});

loadLeads();
</script>
</body>
</html>
