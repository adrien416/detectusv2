# Configuration Supabase CLI — Detectus v2
# Seules les sections nécessaires au déploiement des Edge Functions sont définies.

project_id = "detectusv2"

# ── Edge Functions ────────────────────────────────────────────────────────────

# typeform-sync : appelée depuis le navigateur avec le JWT de session → vérifié.
[functions.typeform-sync]
verify_jwt = true

# typeform-webhook : appelée par Typeform (pas de JWT) → sécurité par signature HMAC.
[functions.typeform-webhook]
verify_jwt = false

# fathom-webhook : appelée par Fathom (pas de JWT) → sécurité par signature svix.
[functions.fathom-webhook]
verify_jwt = false

# fullenrich-credits : appelee depuis le navigateur par les admins connectes.
[functions.fullenrich-credits]
verify_jwt = true

# fullenrich-phone : lance les enrichissements telephone, admin uniquement.
[functions.fullenrich-phone]
verify_jwt = true

# fullenrich-webhook : appelee par FullEnrich, securisee par secret dans l'URL.
[functions.fullenrich-webhook]
verify_jwt = false

# linkedin-search : recherche web de profils LinkedIn candidats, admin uniquement.
[functions.linkedin-search]
verify_jwt = true

# formulaire-maison-submit : appelee par le formulaire public Lina Capital.
[functions.formulaire-maison-submit]
verify_jwt = false

# formulaire-maison-document : ouvre les documents uploades, admin uniquement.
[functions.formulaire-maison-document]
verify_jwt = true
