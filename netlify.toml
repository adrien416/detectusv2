# =============================================================================
# Detectus v2 — Configuration Netlify
#
# Front statique : pas de bundler, pas de framework. La seule étape de build
# est la génération de config.js à partir des variables d'environnement Netlify
# (Site configuration → Environment variables) :
#   SUPABASE_URL      = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY = eyJ... (clé publique, protégée par RLS)
# =============================================================================

[build]
  publish = "dist"
  command = "node -e \"const fs=require('fs');fs.rmSync('dist',{recursive:true,force:true});fs.mkdirSync('dist',{recursive:true});for(const f of ['index.html','formulaire.html','document.html','paris-19juin.html','confidentialite.html'])fs.copyFileSync(f,'dist/'+f);fs.writeFileSync('dist/config.js','window.CONFIG = '+JSON.stringify({SUPABASE_URL:process.env.SUPABASE_URL,SUPABASE_ANON_KEY:process.env.SUPABASE_ANON_KEY})+';')\""

[[redirects]]
  from = "/formulaire"
  to = "/formulaire.html"
  status = 200

[[redirects]]
  from = "/document"
  to = "/document.html"
  status = 200

[[redirects]]
  from = "/paris-19juin"
  to = "/paris-19juin.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

# Ne jamais déployer les sources backend ni la documentation interne
[build.processing]
  skip_processing = true

# ── En-têtes de sécurité ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSP sur le CRM UNIQUEMENT (défense en profondeur contre le XSS — 19 innerHTML).
# Volontairement PAS appliquée aux pages publiques (formulaire, événement 19 juin,
# confidentialité) pour ne prendre aucun risque de casse sur les pages partagées.
# 'unsafe-inline' reste requis : tout le CSS/JS du CRM est inline par conception.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'none'"
